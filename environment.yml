name: warp2dgs
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=12.1
  - pip:
    - numpy==1.26.4
    - plyfile==0.8.1
    - tqdm==4.66.2
    - pillow==10.2.0
    - opencv-python==4.11.0.86
    - scikit-image==0.25.2
    - matplotlib==3.10.0
    - torchmetrics==1.8.2
    - lpips==0.1.4
    - open3d==0.18.0
    - trimesh==4.3.2
    - mediapy==1.1.2
    - wandb==0.25.0
# CUDA extensions are built separately, see README:
#   pip install --no-build-isolation submodules/warp-surfel-rasterization submodules/simple-knn
